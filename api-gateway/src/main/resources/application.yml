server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
                
            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/reservations/**

eureka:
  client:
    service-url:
      '[defaultZone]': http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

logging:
  level:
    '[org.springframework.cloud.gateway]': DEBUG
