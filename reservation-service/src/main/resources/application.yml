server:
  port: 8082

spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:h2:mem:reservationdb
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          '[default]':
            connectTimeout: 5000
            readTimeout: 5000

eureka:
  client:
    service-url:
      '[defaultZone]': http://localhost:8761/eureka/